services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: zai
      POSTGRES_PASSWORD: zai
      POSTGRES_DB: zai
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zai -d zai"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata: